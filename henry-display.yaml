            }
            size_t c = s.find(',', p);
            std::string t = (c == std::string::npos) ? s.substr(p) : s.substr(p, c - p);
            if (t == "sunny") return std::string("\U000F0599");
            if (t == "clear-night") return std::string("\U000F0594");
            if (t == "partlycloudy") return std::string("\U000F0595");
            if (t == "cloudy") return std::string("\U000F0590");
            if (t == "rainy") return std::string("\U000F0597");
            if (t == "pouring") return std::string("\U000F0596");
            if (t == "snowy") return std::string("\U000F0598");
            if (t == "fog") return std::string("\U000F0591");
            if (t == "lightning") return std::string("\U000F0593");
            if (t == "windy") return std::string("\U000F059D");
            return std::string("");
