# ------------------------------------------------------- entities from HA
sensor:
  # Shunt current. Green when charging, grey when discharging.
  - platform: homeassistant
    id: ha_batt_current
    entity_id: sensor.renogy_shunt300_renogy_shunt_current
    on_value:
      - lvgl.label.update:
          id: lbl_batt_current
          text: !lambda |-
            if (std::isnan(x)) return std::string("-- A");
            char buf[16];
            snprintf(buf, sizeof(buf), "%+.1f A", x);
            return std::string(buf);
      - if:
          condition:
            lambda: "return x > 0.0f;"
          then:
            - lvgl.widget.update:
                id: lbl_batt_current
                text_color: 0x35C759
          else:
            - lvgl.widget.update:
                id: lbl_batt_current
                text_color: 0x9AA5B1

  - platform: homeassistant
    id: ha_soc
    entity_id: sensor.renogy_shunt300_renogy_shunt_state_of_charge
    on_value:
      - lvgl.arc.update:
          id: batt_arc
          value: !lambda "return x;"
      - lvgl.label.update:
          id: lbl_soc
          text:
            format: "%.0f%%"
            args: [x]

  # Water meter total: 0 L used = full tank, 35 L used = empty.
  # The displayed number is the actual meter total; only the arc is clamped.
  - platform: homeassistant
    id: ha_water_total
    entity_id: sensor.henry_water_meter_water_total
    on_value:
      - lvgl.arc.update:
          id: water_arc
          value: !lambda |-
            if (std::isnan(x)) return 100;
            return (int) roundf(clamp(x / 35.0f * 100.0f, 0.0f, 100.0f));
      - lvgl.label.update:
          id: lbl_water
          text: !lambda |-
            if (std::isnan(x)) return std::string("--L");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1fL", x);
            return std::string(buf);

  - platform: homeassistant
    id: ha_water_temp
    entity_id: sensor.pro_check_universal_a0f2_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_water_temp
          text:
            format: "%.0f°"
            args: [x]

  # Hot water tank. Graph sampling happens on the 120s interval.
  - platform: homeassistant
    id: ha_wh_temp
    entity_id: sensor.henry_water_heater_tank_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_wh_temp
          text: !lambda |-
            if (std::isnan(x)) return std::string("--°");
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f°", x);
            return std::string(buf);

  - platform: homeassistant
    id: ha_wh_target
    entity_id: number.henry_water_heater_tank_temperature_target
    on_value:
      - if:
          condition:
            lambda: "return std::isnan(x);"
          then:
            - lvgl.label.update:
                id: lbl_tt
                text: "--"
          else:
            - lvgl.slider.update:
                id: sld_tt
                value: !lambda "return roundf(x / 5.0f);"
            - lvgl.label.update:
                id: lbl_tt
                text:
                  format: "%.0f°"
                  args: [x]

  - platform: homeassistant
    id: ha_out_temp
    entity_id: weather.pirateweather
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_outtemp
          text:
            format: "%.0f°"
            args: [x]
      - lvgl.label.update:
          id: lbl_fc_now
          text:
            format: "%.0f°"
            args: [x]

  - platform: homeassistant
    id: ha_fridge_temp
    entity_id: climate.amps_fridge_fridge
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_fridge
          text:
            format: "%.0f°"
            args: [x]
      - lvgl.label.update:
          id: lbl_fridge_now
          text:
            format: "now %.0f°"
            args: [x]

  - platform: homeassistant
    id: ha_fridge_target
    entity_id: climate.amps_fridge_fridge
    attribute: temperature
    on_value:
      - lvgl.arc.update:
          id: fridge_set_arc
          value: !lambda "return x;"
      - lvgl.label.update:
          id: lbl_fridge_set
          text:
            format: "%.0f°"
            args: [x]

  - platform: homeassistant
    id: ha_freezer_temp
    entity_id: climate.amps_fridge_freezer
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_freezer
          text:
            format: "%.0f°"
            args: [x]
      - lvgl.label.update:
          id: lbl_freezer_now
          text:
            format: "now %.0f°"
            args: [x]

  - platform: homeassistant
    id: ha_freezer_target
    entity_id: climate.amps_fridge_freezer
    attribute: temperature
    on_value:
      - lvgl.arc.update:
          id: freezer_set_arc
          value: !lambda "return x;"
      - lvgl.label.update:
          id: lbl_freezer_set
          text:
            format: "%.0f°"
            args: [x]

  - platform: homeassistant
    id: ha_heater_current
    entity_id: sensor.sunster_diesel_heater_ambient_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_heat_now
          text: !lambda |-
            if (std::isnan(x)) return std::string("--°");
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f°", x);
            return std::string(buf);
      - script.execute: move_heat_marker

  - platform: homeassistant
    id: ha_heater_target
    entity_id: climate.sunster_diesel_heater_heater
    attribute: temperature
    on_value:
      - if:
          condition:
            lambda: "return std::isnan(x);"
          then:
            - lvgl.label.update:
                id: lbl_heat_target
                text: "--°"
          else:
            - lvgl.slider.update:
                id: heat_slider
                value: !lambda "return x;"
            - lvgl.label.update:
                id: lbl_heat_target
                text:
                  format: "%.0f°"
                  args: [x]

  - platform: homeassistant
    id: ha_charge_current
    entity_id: number.henry_bt_th_a58a7b70_charge_current
    on_value:
      - if:
          condition:
            lambda: "return std::isnan(x);"
          then:
            - lvgl.label.update:
                id: lbl_cc
                text: "offline"
          else:
            - lvgl.slider.update:
                id: sld_cc
                value: !lambda "return roundf(x / 5.0f);"
            - lvgl.label.update:
                id: lbl_cc
                text:
                  format: "%.0f A"
                  args: [x]

  # ---- forecast, from the trigger template sensor in Home Assistant ----
  - platform: homeassistant
    id: fc_high
    entity_id: sensor.henry_forecast_today
    attribute: temp_high
    on_value:
      - lvgl.label.update:
          id: lbl_fc_high
          text:
            format: "%.0f°"
            args: [x]

  - platform: homeassistant
    id: fc_low
    entity_id: sensor.henry_forecast_today
    attribute: temp_low
    on_value:
      - lvgl.label.update:
          id: lbl_fc_low
          text:
            format: "%.0f°"
            args: [x]

  - platform: homeassistant
    id: fc_rain
    entity_id: sensor.henry_forecast_today
    attribute: rain_pct
    on_value:
      - lvgl.label.update:
          id: lbl_fc_rain
          text:
            format: "%.0f%%"
            args: [x]

  # ---- diagnostics ----
  - platform: wifi_signal
    id: wifi_db
    internal: true
    update_interval: 60s
    on_value:
      - lvgl.label.update:
          id: lbl_wifi
          text:
            format: "Wi-Fi %.0f dBm"
            args: [x]

  - platform: uptime
    id: uptime_s
    internal: true
    update_interval: 60s
    on_value:
      - lvgl.label.update:
          id: lbl_uptime
          text: !lambda |-
            int s = (int) x;
            char buf[24];
            if (s < 3600) snprintf(buf, sizeof(buf), "Up %dm", s / 60);
            else          snprintf(buf, sizeof(buf), "Up %dh %dm", s / 3600, (s % 3600) / 60);
            return std::string(buf);

text_sensor:
  - platform: homeassistant
    id: fc_hours
    entity_id: sensor.henry_forecast_today
    attribute: hours
    on_value:
      - script.execute: update_forecast

  - platform: homeassistant
    id: fc_temps
    entity_id: sensor.henry_forecast_today
    attribute: temps
    on_value:
      - script.execute: update_forecast

  - platform: homeassistant
    id: fc_rains
    entity_id: sensor.henry_forecast_today
    attribute: rains
    on_value:
      - script.execute: update_forecast

  - platform: homeassistant
    id: fc_conds
    entity_id: sensor.henry_forecast_today
    attribute: conds
    on_value:
      - script.execute: update_forecast

  - platform: homeassistant
    id: fc_wind
    entity_id: sensor.henry_forecast_today
    attribute: wind
    on_value:
      - lvgl.label.update:
          id: lbl_fc_wind
          text: !lambda "return x;"

  - platform: homeassistant
    id: fc_sunrise
    entity_id: sensor.henry_forecast_today
    attribute: sunrise
    on_value:
      - script.execute: update_sun_line

  - platform: homeassistant
    id: fc_sunset
    entity_id: sensor.henry_forecast_today
    attribute: sunset
    on_value:
      - script.execute: update_sun_line

  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
      on_value:
        - lvgl.label.update:
            id: lbl_ip
            text: !lambda "return x;"

  - platform: homeassistant
    id: ha_weather
    entity_id: weather.pirateweather
    on_value:
      - lvgl.label.update:
          id: lbl_fc_cond
          text: !lambda |-
            if (x == "partlycloudy")  return std::string("Partly cloudy");
            if (x == "clear-night")   return std::string("Clear");
            if (x == "cloudy")        return std::string("Cloudy");
            if (x == "sunny")         return std::string("Sunny");
            if (x == "rainy")         return std::string("Rain");
            if (x == "pouring")       return std::string("Heavy rain");
            if (x == "snowy")         return std::string("Snow");
            if (x == "fog")           return std::string("Fog");
            if (x == "windy")         return std::string("Windy");
            if (x == "lightning")     return std::string("Thunder");
            return x;
      - lvgl.label.update:
          id: lbl_weather
          text: !lambda |-
            if (x == "partlycloudy")  return std::string("Partly cloudy");
            if (x == "clear-night")   return std::string("Clear");
            if (x == "cloudy")        return std::string("Cloudy");
            if (x == "sunny")         return std::string("Sunny");
            if (x == "rainy")         return std::string("Rain");
            if (x == "pouring")       return std::string("Heavy rain");
            if (x == "snowy")         return std::string("Snow");
            if (x == "fog")           return std::string("Fog");
            if (x == "windy")         return std::string("Windy");
            if (x == "lightning")     return std::string("Thunder");
            return x;

  - platform: homeassistant
    id: ha_output
    entity_id: switch.henry_bt_th_a58a7b70_output
    on_value:
      - if:
          condition:
            lambda: 'return x != "on" && x != "off";'
          then:
            - lvgl.widget.update:
                id: sw_output
                state:
                  disabled: true
                  checked: false
          else:
            - lvgl.widget.update:
                id: sw_output
                state:
                  disabled: false
                  checked: !lambda 'return x == "on";'

  - platform: homeassistant
    id: ha_fridge_power
    entity_id: switch.henry_amps_fridge_amps_fridge_power
    on_value:
      - lvgl.widget.update:
          id: sw_fridge
          state:
            checked: !lambda 'return x == "on";'

  # Element on turns the trace orange, off greys it out.
  - platform: homeassistant
    id: ha_wh_element
    entity_id: switch.henry_henry_water_heater_element_switch
    on_value:
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.widget.update:
                id: sw_water
                state:
                  checked: true
            - lvgl.widget.update:
                id: wh_line
                line_color: 0xFF7A45
          else:
            - lvgl.widget.update:
                id: sw_water
                state:
                  checked: false
            - lvgl.widget.update:
                id: wh_line
                line_color: 0x6B7785

  - platform: homeassistant
    id: ha_mcc
    entity_id: select.henry_renogy_dcc_renogy_max_charging_current
    on_value:
      - script.execute:
          id: set_mcc_buttons
          sel: !lambda |-
            if (x == "10A") return 0;
            if (x == "20A") return 1;
            if (x == "30A") return 2;
            if (x == "40A") return 3;
            if (x == "50A") return 4;
            if (x == "60A") return 5;
            return -1;

  - platform: homeassistant
    id: ha_heater
    entity_id: climate.sunster_diesel_heater_heater
    on_value:
      - lvgl.widget.update:
          id: sw_heater
          state:
            checked: !lambda 'return x != "off" && x != "unavailable";'
      - lvgl.label.update:
          id: lbl_heater
          text: !lambda |-
            if (x == "off")  return std::string("Off");
            if (x == "heat") return std::string("Heating");
            return x;
