substitutions:
  name: henrydisplay
  friendly_name: Henry Display

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - script.execute: apply_brightness
        - script.execute: idle_timer

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:

ota:
  - platform: esphome
    on_begin:
      - light.turn_off:
          id: backlight
          transition_length: 0s
      - lambda: "id(backlight).loop();"

wifi:
  ssid: !secret henryvan_wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

# To have a "next url" for improv serial
web_server:

switch:
# Switch to restart the ESP Pool.
  - platform: restart
    name: Restart

globals:
  - id: fc_hr
    type: float[6]
    restore_value: false
  - id: fc_tp
    type: float[6]
    restore_value: false
  - id: fc_rn
    type: float[6]
    restore_value: false
  - id: fc_bar
    type: float[6]
    restore_value: false

  - id: screen_dimmed
    type: bool
    restore_value: false
    initial_value: "false"

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/London
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

# Samples the tank temperature into the graph every 2 minutes.
# 60 samples x 2 min = the 2 hour window.
interval:
  - interval: 120s
    then:
      - script.execute: sample_tank_temp

# ------------------------------------------------------------------ scripts
script:
  - id: update_clock
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("");
            return t.strftime("%A %d %B");

  # Marker position along the heater slider. Range is 8-36 over 440px.
  - id: move_heat_marker
    then:
      - lambda: |-
          float t = id(ha_heater_current).state;
          if (std::isnan(t)) return;
          float c = clamp(t, 8.0f, 36.0f);
          int px = (int) roundf((c - 8.0f) / 28.0f * 440.0f);
          lv_obj_set_x(id(heat_marker), px - 20);

  # ESPHome can't read Home Assistant's history, so the trace is built
  # locally and starts empty after a reboot. Scale is fixed at 10-70 C so
  # small drifts don't get exaggerated into dramatic-looking swings.
  - id: sample_tank_temp
    then:
      - lambda: |-
          static float hist[60];
          static uint8_t count = 0;
          static lv_point_precise_t pts[60];

          float t = id(ha_wh_temp).state;
          if (std::isnan(t)) return;

          if (count < 60) {
            hist[count++] = t;
          } else {
            for (int i = 0; i < 59; i++) hist[i] = hist[i + 1];
            hist[59] = t;
          }
          if (count < 2) return;

          const float lo = 10.0f, hi = 70.0f;
          const float w = 125.0f, h = 79.0f;
          for (int i = 0; i < count; i++) {
            float v = clamp(hist[i], lo, hi);
            pts[i].x = (int32_t) roundf(w * i / 59.0f);
            pts[i].y = (int32_t) roundf(h - ((v - lo) / (hi - lo)) * h);
          }
          lv_line_set_points(id(wh_line)->obj, pts, count);

  # Splits the three CSV attributes into the six hourly columns. Bar heights
  # scale to the range within the window, so a flat day still shows shape.
  - id: update_forecast
    then:
      - lambda: |-
          auto split = [](const std::string &in, float *out) {
            int i = 0;
            size_t p = 0;
            while (i < 6) {
              size_t c = in.find(',', p);
              std::string tok = (c == std::string::npos) ? in.substr(p) : in.substr(p, c - p);
              out[i++] = tok.empty() ? NAN : (float) atof(tok.c_str());
              if (c == std::string::npos) break;
              p = c + 1;
            }
            while (i < 6) out[i++] = NAN;
          };
          split(id(fc_hours).state, id(fc_hr));
          split(id(fc_temps).state, id(fc_tp));
          split(id(fc_rains).state, id(fc_rn));

          float lo = 1000.0f, hi = -1000.0f;
          for (int i = 0; i < 6; i++) {
            float t = id(fc_tp)[i];
            if (std::isnan(t)) continue;
            if (t < lo) lo = t;
            if (t > hi) hi = t;
          }
          if (lo > hi) { lo = 0.0f; hi = 1.0f; }
          lo -= 1.0f;
          hi += 1.0f;
          for (int i = 0; i < 6; i++) {
            float t = id(fc_tp)[i];
            id(fc_bar)[i] = std::isnan(t) ? 0.0f
                          : clamp((t - lo) / (hi - lo) * 100.0f, 0.0f, 100.0f);
          }
      - lvgl.bar.update:
          id: fc_bar_0
          value: !lambda "return id(fc_bar)[0];"
      - lvgl.label.update:
          id: lbl_fc_h0
          text: !lambda |-
            if (std::isnan(id(fc_hr)[0])) return std::string("--");
            char b[8];
            snprintf(b, sizeof(b), "%02d", (int) id(fc_hr)[0]);
            return std::string(b);
      - lvgl.label.update:
          id: lbl_fc_t0
          text: !lambda |-
            if (std::isnan(id(fc_tp)[0])) return std::string("--");
            char b[8];
            snprintf(b, sizeof(b), "%.0f°", id(fc_tp)[0]);
            return std::string(b);
      - lvgl.label.update:
          id: lbl_fc_r0
          text: !lambda |-
