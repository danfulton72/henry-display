                   std::string("    Sunset ") + id(fc_sunset).state;

  - id: apply_brightness
    then:
      - if:
          condition:
            lambda: "return !id(screen_dimmed);"
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda "return id(cfg_brightness).state / 100.0f;"

  # LVGL is paused while dimmed so the tap that wakes the panel can't
  # press through to whatever is under your finger.
  - id: screen_dim
    then:
      - lambda: "id(screen_dimmed) = true;"
      - light.turn_on:
          id: backlight
          brightness: !lambda "return id(cfg_dim_level).state / 100.0f;"
          transition_length: 500ms
      - lvgl.pause:

  - id: wake_screen
    then:
      - lambda: "id(screen_dimmed) = false;"
      - lvgl.resume:
      - lvgl.widget.redraw:
      - script.execute: apply_brightness
      - script.execute: idle_timer

  # Index 21 means Never, so the countdown simply doesn't start.
  - id: idle_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(cfg_timeout_index).state < 21;"
          then:
            - delay: !lambda "return (uint32_t)(id(cfg_timeout_index).state * 30000.0f);"
            - script.execute: screen_dim

  # Mutual exclusion for the max charging current buttons.
  - id: set_mcc_buttons
    parameters:
      sel: int
    then:
      - lvgl.widget.update:
          id: btn_mcc_10
          state:
            checked: !lambda "return sel == 0;"
      - lvgl.widget.update:
          id: btn_mcc_20
          state:
            checked: !lambda "return sel == 1;"
      - lvgl.widget.update:
          id: btn_mcc_30
          state:
            checked: !lambda "return sel == 2;"
      - lvgl.widget.update:
          id: btn_mcc_40
          state:
            checked: !lambda "return sel == 3;"
      - lvgl.widget.update:
          id: btn_mcc_50
          state:
            checked: !lambda "return sel == 4;"
      - lvgl.widget.update:
          id: btn_mcc_60
          state:
            checked: !lambda "return sel == 5;"

# ---------------------------------------------------------------- hardware
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 1000Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: Backlight
    id: backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touch_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true

font:
  - file: &roboto "gfonts://Roboto"
    id: f_14
    size: 14
    glyphs: &glyphs ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°·'
  - file: *roboto
    id: f_16
    size: 16
    glyphs: *glyphs
  - file: *roboto
    id: f_18
    size: 18
    glyphs: *glyphs
  - file: *roboto
    id: f_20
    size: 20
    glyphs: *glyphs
  - file: *roboto
    id: f_22
    size: 22
    glyphs: *glyphs
  - file: *roboto
    id: f_26
    size: 26
    glyphs: *glyphs
  - file: *roboto
    id: f_48
    size: 48
    glyphs: *glyphs
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: f_icon
    size: 24
    bpp: 4
    glyphs: [
      "\U000F0590",
      "\U000F0591",
      "\U000F0593",
      "\U000F0594",
      "\U000F0595",
      "\U000F0596",
      "\U000F0597",
      "\U000F0598",
      "\U000F0599",
      "\U000F059D",
      ]

display:
  - platform: st7701s
    id: tft
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 480
      height: 480
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [GPIO11, GPIO12, GPIO13, GPIO14, GPIO0]
      green: [GPIO8, GPIO20, GPIO3, GPIO46, GPIO9, GPIO10]
      blue: [GPIO4, GPIO5, GPIO6, GPIO7, GPIO15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft
    on_touch:
      - if:
          condition:
            lambda: "return id(screen_dimmed);"
          then:
            - script.execute: wake_screen
          else:
            - script.execute: idle_timer

# ------------------------------------------------------- persisted settings
number:
  - platform: template
    id: cfg_brightness
    name: "Screen brightness"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 80
    min_value: 10
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    on_value:
      - script.execute: apply_brightness
      - lvgl.slider.update:
          id: sld_brightness
          value: !lambda "return x;"
      - lvgl.label.update:
          id: lbl_brightness
          text:
            format: "%.0f%%"
            args: [x]

  - platform: template
    id: cfg_dim_level
    name: "Screen dim level"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 1
    max_value: 50
    step: 1
    unit_of_measurement: "%"
    on_value:
      - lvgl.slider.update:
          id: sld_dim
          value: !lambda "return x;"
      - lvgl.label.update:
          id: lbl_dim
          text:
            format: "%.0f%%"
            args: [x]

  # 1-20 map to n x 30 seconds. 21 means never.
  - platform: template
    id: cfg_timeout_index
    name: "Screen timeout steps"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 4
    min_value: 1
    max_value: 21
    step: 1
    on_value:
      - lvgl.slider.update:
          id: sld_timeout
          value: !lambda "return x;"
      - lvgl.label.update:
          id: lbl_timeout
          text: !lambda |-
            int v = (int) x;
            if (v >= 21) return std::string("Never");
            int s = v * 30;
            char buf[32];
            if (s < 60)      snprintf(buf, sizeof(buf), "%ds", s);
            else if (s % 60) snprintf(buf, sizeof(buf), "%dm %ds", s / 60, s % 60);
            else             snprintf(buf, sizeof(buf), "%dm", s / 60);
            return std::string(buf);
      - script.execute: idle_timer

